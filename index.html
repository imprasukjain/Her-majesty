<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>11:11</title>
  <meta name="description" content="Make a wish." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0b0716" />
  <meta property="og:title" content="11:11" />
  <meta property="og:description" content="Make a wish." />

  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="manifest" href="site.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/wish.css" />
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>

  <main>
    <!-- Step 1: the clock -->
    <section class="scene scene--clock is-active" id="clock">
      <button class="clock" id="clockBtn" type="button" aria-label="It's 11:11. Tap to make a wish">
        <span class="clock__digits">11<i>:</i>11</span>
      </button>
      <p class="hint" id="hint"></p>
    </section>

    <!-- Step 2: a quiet moment -->
    <section class="scene scene--wish" id="wish">
      <p class="wish__line" id="wishLine"></p>
    </section>

    <!-- Step 3: the letter -->
    <section class="scene scene--letter" id="letter">
      <div class="letter" id="letterBody"></div>
      <p class="sign" id="sign"></p>
    </section>
  </main>

  <script src="js/message.js"></script>
  <script src="js/wish.js"></script>
</body>
</html>
