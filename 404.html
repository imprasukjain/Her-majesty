<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Lost — but it's still your birthday</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#170c1e">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem 1.2rem;
      text-align: center;
      font-family: 'Quicksand', system-ui, sans-serif;
      color: #f7edf5;
      background:
        radial-gradient(120% 80% at 50% 0%, #43204f 0%, transparent 60%),
        radial-gradient(90% 60% at 15% 100%, #5c2340 0%, transparent 55%),
        #150b1c;
    }

    .balloon {
      font-size: 4rem;
      animation: floaty 3.4s ease-in-out infinite;
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50%      { transform: translateY(-16px) rotate(3deg); }
    }

    h1 {
      margin: 1rem 0 .3rem;
      font-family: 'Parisienne', cursive;
      font-weight: 400;
      font-size: clamp(2.4rem, 11vw, 4rem);
      line-height: 1;
      background: linear-gradient(115deg, #f6c96b, #ffa7c0 50%, #b88cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      margin: 0 auto 2rem;
      max-width: 26rem;
      font-size: 1rem;
      line-height: 1.7;
      color: #c9b3cd;
    }

    a {
      display: inline-block;
      padding: .85em 1.7em;
      border-radius: 999px;
      font-weight: 700;
      color: #2a0d1c;
      text-decoration: none;
      background: linear-gradient(135deg, #f6c96b, #ffa7c0);
      box-shadow: 0 10px 26px -10px rgba(255, 95, 141, .8);
      transition: transform .25s ease;
    }

    a:hover { transform: translateY(-3px); }

    @media (prefers-reduced-motion: reduce) {
      .balloon { animation: none; }
    }
  </style>
</head>

<body>
  <main>
    <div class="balloon">🎈</div>
    <h1>This one got away</h1>
    <p>There's no page here — the balloon must have drifted off. The birthday, however, is still very much on.</p>
    <a href="/">Take me back to the card</a>
  </main>
</body>

</html>
